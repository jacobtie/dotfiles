unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-ghostty:Tc,*:Smulx=\\E[4::%p1%dm,*:Setulc=\\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"
set-option -g detach-on-destroy off

set -g mouse on
set -g renumber-windows on
set -g base-index 1

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

set-option -g status-position top

# Ensure Homebrew bash is found first (powerkit requires bash 4+)
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @powerkit_plugins "git"
set -g @powerkit_theme "tokyo-night"
set -g @powerkit_theme_variant "night"

run '~/.tmux/plugins/tpm/tpm'
